name: learners-hub

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      H5P_RUNTIME_BASE_URL: ${H5P_PUBLIC_ORIGIN:?Set H5P_PUBLIC_ORIGIN}
      H5P_RUNTIME_SHARED_SECRET: ${H5P_RUNTIME_SHARED_SECRET:?Set H5P_RUNTIME_SHARED_SECRET}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    ports:
      - "127.0.0.1:${WEB_LOOPBACK_PORT:-13000}:3000"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

  h5p-runtime:
    build:
      context: ../../services/h5p-runtime
    environment:
      H5P_DATA_DIR: /data
      H5P_RUNTIME_SHARED_SECRET: ${H5P_RUNTIME_SHARED_SECRET:?Set H5P_RUNTIME_SHARED_SECRET}
      LEARNERS_HUB_ORIGIN: ${LEARNERS_HUB_ORIGIN:?Set LEARNERS_HUB_ORIGIN}
      NODE_ENV: production
      PORT: 8080
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1250m
    ports:
      - "127.0.0.1:${H5P_LOOPBACK_PORT:-18080}:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - h5p-data:/data

  redis:
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    image: redis:7.4-alpine
    mem_limit: 192m
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data:size=32m,mode=0700

volumes:
  h5p-data:
